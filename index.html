// ── Data (Supabase + localStorage hybrid) ───────────────────────
var SUPA_BASE = "https://wwovdtlnecmatenbpttc.supabase.co/rest/v1";
var SUPA_KEY = "sb_publishable_y4t6yXoSShZPBecPAHDVYw_wuwATq0W";
var LS_KEY = "zedhub_v2";

function supaHeaders() {
  return { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" };
}

function loadLocal() {
  try {
    var s = localStorage.getItem(LS_KEY);
    if (s) {
      var d = JSON.parse(s);
      if (d && d.requests) { if (!d.clients) d.clients = []; return d; }
    }
  } catch(e) {}
  return {requests: [], orders: [], clients: [], references: [], tasks: []};
}

async function supaFetch(table) {
  var res = await fetch(SUPA_BASE + "/" + table + "?select=id,data&limit=10000", { headers: supaHeaders() });
  var rows = await res.json();
  return Array.isArray(rows) ? rows.map(function(r){ var d = r.data||{}; d.id = r.id; return d; }) : [];
}

async function cloudLoad() {
  var results = await Promise.all([ supaFetch("requests"), supaFetch("orders"), supaFetch("clients"), supaFetch("refs"), supaFetch("tasks") ]);
  return { requests: results[0], orders: results[1], clients: results[2], references: results[3], tasks: results[4] };
}

// Sync queue
var _syncQueue = [];
var _syncTimer = null;

function queueSync(table, record) {
  _syncQueue.push({ table: table, record: record });
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(flushSync, 1000);
}

function setSyncState(state) {
  // state: "ok" | "syncing" | "error"
  var dot = document.getElementById("sync-dot");
  var txt = document.getElementById("sync-text");
  var wrap = document.getElementById("sync-indicator");
  if (!dot || !txt || !wrap) return;
  if (state === "syncing") {
    dot.style.background = "#f59e0b"; wrap.style.color = "#f59e0b"; txt.textContent = "Синхронізація…";
  } else if (state === "error") {
    dot.style.background = "#ef4444"; wrap.style.color = "#ef4444"; txt.textContent = "Не збережено в хмару";
  } else {
    dot.style.background = "#16a34a"; wrap.style.color = "#16a34a"; txt.textContent = "Синхронізовано";
  }
}

async function flushSync() {
  var queue = _syncQueue.slice();
  _syncQueue = [];
  setSyncState("syncing");
  var hadError = false;
  for (var i = 0; i < queue.length; i++) {
    var item = queue[i];
    try {
      var res = await fetch(SUPA_BASE + "/" + item.table, {
        method: "POST", headers: supaHeaders(),
        body: JSON.stringify({ id: item.record.id, data: item.record, updated_at: new Date().toISOString() })
      });
      if (!res.ok) { hadError = true; }
    } catch(e) { hadError = true; }
  }
  setSyncState(hadError ? "error" : "ok");
}

async function supaDelete(table, id) {
  try { await fetch(SUPA_BASE + "/" + table + "?id=eq." + id, { method: "DELETE", headers: supaHeaders() }); } catch(e) {}
}

async function initCloud() {
  try {
    var fresh = await cloudLoad();
    if (fresh && (fresh.requests.length || fresh.orders.length || fresh.clients.length)) {
      db = fresh;
      try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch(e) {}
      render();
      updateCounts();
    }
  } catch(e) {}
  // Запустити живе оновлення раз на 10 сек
  startLiveRefresh();
}

var _liveTimer = null;
var _lastSnapshot = "";

function startLiveRefresh() {
  if (_liveTimer) clearInterval(_liveTimer);
  _liveTimer = setInterval(liveRefresh, 10000);
}

async function liveRefresh() {
  // Не оновлювати поки відкрита форма редагування — щоб не збити введення
  var modalArea = document.getElementById("modal-area");
  if (modalArea && modalArea.innerHTML.trim() !== "") return;
  // Не оновлювати поки є незавершена синхронізація (щоб не перетерти свіже)
  if (_syncQueue.length > 0) return;
  try {
    var fresh = await cloudLoad();
    if (!fresh) return;
    // Порівняти зі знімком — оновлювати тільки якщо реально змінилось
    var snap = JSON.stringify({r:fresh.requests.length, o:fresh.orders.length, c:(fresh.clients||[]).length, ref:(fresh.references||[]).length})
      + ":" + fresh.requests.map(function(x){return x.id+"-"+(x._v||0);}).join(",")
      + ":" + fresh.orders.map(function(x){return x.id+"-"+(x._v||0);}).join(",")
      + ":" + (fresh.tasks||[]).map(function(x){return x.id+"-"+(x._v||0);}).join(",");
    if (snap === _lastSnapshot) return;
    _lastSnapshot = snap;
    db = fresh;
    try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch(e) {}
    render();
    updateCounts();
  } catch(e) {}
}


function renumberAll() {
  if (!confirm("Перенумерувати ВСІ запити (0001, 0002...) та їх ордери (ZED0001...)?\n\nЦе оновить існуючі номери. Продовжити?")) return;
  // Sort requests by current req_num / id to keep chronological order
  var sorted = db.requests.slice().sort(function(a,b){
    return (a.id||0) - (b.id||0);
  });
  var counter = 1;
  var mapping = {}; // old order_id -> new order_id
  sorted.forEach(function(r){
    var newNum = String(counter).padStart(4, "0");
    counter++;
    var oldOrderId = r.order_id;
    r.req_num = newNum;
    // If request had an order_id, update it to ZED+newNum
    if (oldOrderId && oldOrderId !== "Rejected ❌") {
      var newOrderId = "ZED" + newNum;
      mapping[oldOrderId] = newOrderId;
      r.order_id = newOrderId;
    }
  });
  // Update matching orders
  db.orders.forEach(function(o){
    if (mapping[o.order_id]) {
      o.req_id = mapping[o.order_id].replace("ZED","");
      o.order_id = mapping[o.order_id];
    }
  });
  save();
  render();
  alert("Готово! Перенумеровано " + sorted.length + " запитів.");
}

function updateCounts() {
  var active = db.requests.filter(function(r){return r.status !== "Rejected";}).length;
  document.getElementById("cnt-req").textContent = db.requests.length;
  document.getElementById("cnt-ord").textContent = db.orders.length;
  var cliEl = document.getElementById("cnt-cli");
  if (cliEl) cliEl.textContent = (db.clients||[]).length;
  var transitEl = document.getElementById("cnt-transit");
  if (transitEl) {
    try {
      var tCount = (db.orders||[]).filter(function(o){
        var d1 = daysUntil(o.eta);
        var d2 = daysUntil(o.eta_plan);
        var in1 = d1 !== null && d1 >= -10 && d1 <= 10;
        var in2 = d2 !== null && d2 >= -10 && d2 <= 10;
        return in1 || in2;
      }).length;
      transitEl.textContent = tCount;
    } catch(e) {}
  }
  var refEl = document.getElementById("cnt-ref");
  if (refEl) refEl.textContent = (db.references||[]).length;
  var taskEl = document.getElementById("cnt-task");
  if (taskEl) {
    var openTasks = (db.tasks||[]).filter(function(t){return t.status!=="Виконана";}).length;
    taskEl.textContent = openTasks;
  }
}

function exportBackup() {
  var blob = new Blob([JSON.stringify(db, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "zedhub-backup-" + new Date().toLocaleDateString("uk-UA").replace(/\./g,"-") + ".json";
  a.click();
}

function restoreBackup(file) {
  var r = new FileReader();
  r.onload = function(e) {
    try {
      var d = JSON.parse(e.target.result);
      if (d && d.requests) {
        db = d;
        save();
        render();
        alert("Відновлено: " + d.requests.length + " запитів, " + (d.orders||[]).length + " ордерів");
      }
    } catch(ex) { alert("Помилка відновлення: " + ex.message); }
  };
  r.readAsText(file);
}

function renderRequests() {
  var filtered = db.requests.filter(function(r) {
    var q = reqSearch.toLowerCase();
    var matchQ = !q || r.client.toLowerCase().indexOf(q) >= 0 || r.route.toLowerCase().indexOf(q) >= 0 || (r.cargo||"").toLowerCase().indexOf(q) >= 0;
    var matchF = !reqFilter || r.status === reqFilter;
    var matchM = !reqManagerFilter || (r.manager||"") === reqManagerFilter;
    var matchD = inDateRange(r.date, reqDateFrom, reqDateTo);
    return matchQ && matchF && matchM && matchD;
  });
  filtered.sort(function(a,b){
    var x = (a.req_num||""), y = (b.req_num||"");
    return reqSort === "new" ? y.localeCompare(x) : x.localeCompare(y);
  });

  var accepted = db.requests.filter(function(r){return r.status==="Accepted";}).length;
  var inProgress = db.requests.filter(function(r){return r.status==="Прораховується"||r.status==="На погодженні";}).length;
  var rejected = db.requests.filter(function(r){return r.status==="Rejected";}).length;

  var html = "<div class='stats-bar'>"
    + "<div class='stat-card'><div class='stat-val'>" + db.requests.length + "</div><div class='stat-label'>ВСЬОГО ЗАПИТІВ</div></div>"
    + "<div class='stat-card'><div class='stat-val' style='color:#16a34a'>" + accepted + "</div><div class='stat-label'>ACCEPTED → ОРДЕР</div></div>"
    + "<div class='stat-card'><div class='stat-val' style='color:#f59e0b'>" + inProgress + "</div><div class='stat-label'>В РОБОТІ</div></div>"
    + "<div class='stat-card'><div class='stat-val' style='color:#ef4444'>" + rejected + "</div><div class='stat-label'>REJECTED</div></div>"
    + "</div>";

  html += "<div class='toolbar'>"
    + "<input class='search-box' placeholder='🔍 Пошук по клієнту, маршруту...' value='" + escQ(reqSearch) + "' id='search-req' oninput='reqSearch=this.value;renderRequests();refocus(&quot;search-req&quot;)'>"
    + "<select class='filter-sel' onchange='reqFilter=this.value;renderRequests()'>"
    + "<option value=''>Всі статуси</option>"
    + REQ_STATUSES.map(function(s){return "<option value='" + s + "'" + (reqFilter===s?" selected":"") + ">" + s + "</option>";}).join("")
    + "</select>"
    + "<select class='filter-sel' onchange='reqManagerFilter=this.value;renderRequests()'>"
    + "<option value=''>👤 Всі менеджери</option>"
    + MANAGERS.filter(function(m){return m!=="—";}).map(function(m){return "<option value='" + m + "'" + (reqManagerFilter===m?" selected":"") + ">" + m + "</option>";}).join("")
    + "</select>"
    + "<button class='btn btn-gray' onclick='reqSort=reqSort===\"new\"?\"old\":\"new\";renderRequests()'>" + (reqSort==="new"?"↓ Новіші":"↑ Старіші") + "</button>"
    + "<span style='display:flex;align-items:center;gap:4px;font-size:11px;color:#6b7280'>📅 <input type='date' class='filter-sel' style='padding:5px 8px' value='" + reqDateFrom + "' onchange='reqDateFrom=this.value;renderRequests()'> — <input type='date' class='filter-sel' style='padding:5px 8px' value='" + reqDateTo + "' onchange='reqDateTo=this.value;renderRequests()'>"
    + (reqDateFrom||reqDateTo ? " <button class='act-btn' onclick='reqDateFrom=\"\";reqDateTo=\"\";renderRequests()'>✕</button>" : "") + "</span>"
    + "<button class='btn btn-yellow' onclick='openAddRequest()'>+ Новий запит</button>"
    + "</div>";

  if (!filtered.length) {
    html += "<div class='empty-state'><div class='empty-icon'>📋</div><div class='empty-text'>Запитів не знайдено</div></div>";
    document.getElementById("main-content").innerHTML = html;
    return;
  }

  html += "<div class='table-wrap'><table><thead><tr>"
    + "<th>№ ЗАПИТУ</th><th>ДАТА</th><th class='col-client'>КЛІЄНТ</th><th class='col-route'>МАРШРУТ / ТИП</th>"
    + "<th>ВАНТАЖ</th><th>ГОТОВНІСТЬ</th><th class='col-sum'>НАЦІНКА $</th><th class='col-status'>СТАТУС</th>"
    + "<th>МЕНЕДЖЕР</th><th>ДІЇ</th>"
    + "</tr></thead><tbody>";

  filtered.forEach(function(r) {
    html += "<tr class='" + (r.status==="Accepted"?"highlight":"") + "'>"
      + "<td><span style='font-family:monospace;font-size:11px;color:#374151'>" + escQ(r.req_num||"—") + "</span></td>"

      + "<td class='col-sum' style='font-weight:600;font-size:12px;color:#16a34a'>$ " + ((r.sum_brutto||0)-(r.sum_netto||0)).toLocaleString("uk-UA") + "</td>"

      + "<td style='white-space:nowrap'>"
      + "<button class='act-btn' onclick='openEditRequest(" + r.id + ")'>✏️</button> "
      + "<button class='act-btn' style='color:#3b82f6' title='Відправити логістам на прорахунок' onclick='sendToLogist(" + r.id + ")'>📤</button> "
      + (r.status==="Accepted"&&!r.order_id ? "<button class='act-btn' style='color:#16a34a' onclick='createOrder(" + r.id + ")'>→ Ордер</button> " : "")
      + "<button class='act-btn del' onclick='deleteRequest(" + r.id + ")'>✕</button>"
      + "</td></tr>";
  });

  html += "</tbody></table></div>";
  document.getElementById("main-content").innerHTML = html;
}



// ── КОМПАКТНИЙ ВИГЛЯД ОРДЕРІВ ────────────────────────────────────
var STAGE_DONE = "#16a34a", STAGE_PROG = "#f59e0b", STAGE_TBD = "#d1d5db", STAGE_ALERT = "#ef4444";

function stageColor(kind, s) {
  s = s || "TBD";
  if (kind === "cargo") {
    if (s === "Прибув" || s === "Розвантажено") return STAGE_DONE;
    if (s === "Завантажено" || s === "В дорозі") return STAGE_PROG;
    return STAGE_TBD;
  }
  if (kind === "customs") {
    if (s === "Розмитнено") return STAGE_DONE;
    if (s === "Док подані" || s === "Скан" || s === "Фіз огляд") return STAGE_PROG;
    return STAGE_TBD;
  }
  if (kind === "resort") {
    if (s === "Завершено" || s === "Не потрібна") return STAGE_DONE;
    if (s === "В процесі") return STAGE_PROG;
    return STAGE_TBD;
  }
  if (kind === "delivery") {
    if (s === "Доставлено") return STAGE_DONE;
    if (s === "Потребує уточнення") return STAGE_ALERT;
    if (s === "Транспорт призначено" || s === "Завантажено" || s === "В дорозі") return STAGE_PROG;
    return STAGE_TBD;
  }
  return STAGE_TBD;
}

function orderStages(o) {
  return [
    { label: "Вантаж", status: o.cargo_status || "TBD", color: stageColor("cargo", o.cargo_status) },
    { label: "Митн. EX", status: o.customs_pl_status || "TBD", color: stageColor("customs", o.customs_pl_status) },
    { label: "Перетарка", status: o.resort || "TBD", color: stageColor("resort", o.resort) },
    { label: "Митн. UA", status: o.customs_status || "TBD", color: stageColor("customs", o.customs_status) },
    { label: "Доставка", status: o.delivery_status || "TBD", color: stageColor("delivery", o.delivery_status) }
  ];
}

function progressTrack(o) {
  var stages = orderStages(o);
  var segs = stages.map(function(s){
    return "<div title='" + escQ(s.label + ": " + s.status) + "' style='flex:1;height:8px;border-radius:2px;background:" + s.color + "'></div>";
  }).join("");
  var current = "Завершено ✓";
  for (var i = 0; i < stages.length; i++) {
    if (stages[i].color !== STAGE_DONE) { current = stages[i].label + ": " + stages[i].status; break; }
  }
  return "<div style='display:flex;gap:3px;margin-bottom:3px'>" + segs + "</div>"
    + "<div style='font-size:11px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>" + escQ(current) + "</div>";
}

// ── ORDERS ───────────────────────────────────────────────────────
function renderOrders() {
  var filtered = db.orders.filter(function(o) {
    var q = ordSearch.toLowerCase();
    var matchSearch = !q || o.client.toLowerCase().indexOf(q) >= 0 || o.order_id.toLowerCase().indexOf(q) >= 0 || (o.route_full||o.route||"").toLowerCase().indexOf(q) >= 0 || (o.container||"").toLowerCase().indexOf(q) >= 0 || (o.booking||"").toLowerCase().indexOf(q) >= 0 || (o.carrier||"").toLowerCase().indexOf(q) >= 0 || (o.incoterm_code||"").toLowerCase().indexOf(q) >= 0 || (o.incoterms||"").toLowerCase().indexOf(q) >= 0;
    var matchManager = ordManagerSel.length===0 || ordManagerSel.indexOf(o.manager||"") >= 0;
    var matchLogist = ordLogistSel.length===0 || ordLogistSel.indexOf(o.logist||"") >= 0;
    var matchCargo = !ordCargoFilter || (o.delivery_status||"") === ordCargoFilter;
    var matchD = inDateRange(o.date, ordDateFrom, ordDateTo);
    return matchSearch && matchManager && matchLogist && matchCargo && matchD;
  });
  filtered.sort(function(a,b){
    if (ordSort === "eta" || ordSort === "etd" || ordSort === "cutoff") {
      var fld = ordSort;
      var da = parseDateVal(a[fld]), dbb = parseDateVal(b[fld]);
      // Empty dates go to the bottom
      if (da === null && dbb === null) return 0;
      if (da === null) return 1;
      if (dbb === null) return -1;
      return da - dbb; // soonest first
    }
    var x = (a.order_id||""), y = (b.order_id||"");
    return ordSort === "new" ? y.localeCompare(x, undefined, {numeric:true}) : x.localeCompare(y, undefined, {numeric:true});
  });

  var totalMarkup = filtered.reduce(function(s,o){return s+(num(o.sum_brutto)-num(o.sum_netto))+num(o.markup_auto)+num(o.markup_local);},0);

  var execActive = ordManagerSel.length > 0 || ordLogistSel.length > 0;
  var ordersStatVal = execActive
    ? "<span style='color:#f59e0b'>" + filtered.length + "</span><span style='font-size:14px;color:#9ca3af'> / " + db.orders.length + "</span>"
    : String(db.orders.length);
  var ordersStatLabel = execActive ? "ОРДЕРІВ" : "ВСЬОГО ОРДЕРІВ";

    + "<div class='stat-card'><div class='stat-val'>" + ordersStatVal + "</div><div class='stat-label'>" + ordersStatLabel + "</div></div>"
    + "<div class='stat-card'><div class='stat-val' style='color:#16a34a'>$ " + totalMarkup.toLocaleString("uk-UA") + "</div><div class='stat-label'>" + (execActive ? "НАЦІНКА" : "ЗАГАЛЬНА НАЦІНКА") + "</div></div>"
    + "</div>";

  var selCount = Object.keys(_selectedOrders).length;
  html += "<div class='toolbar'>"
    + "<input class='search-box' placeholder='🔍 Пошук по ORDER ID, клієнту, маршруту...' value='" + escQ(ordSearch) + "' id='search-ord' oninput='ordSearch=this.value;renderOrders();refocus(&quot;search-ord&quot;)'>"
    + (function(){
        var cnt = ordManagerSel.length + ordLogistSel.length;
        var btn = "<div style='position:relative;display:inline-block;z-index:120'>"

        if (ordExecOpen) {

            + "<div style='font-size:10px;font-weight:700;color:#6b7280;margin-bottom:5px'>МЕНЕДЖЕРИ</div>"
            + MANAGERS.filter(function(m){return m!=="—";}).map(function(m,idx){

  if (!filtered.length) {
    html += "<div class='empty-state'><div class='empty-icon'>🔖</div><div class='empty-text'>Ордерів не знайдено</div></div>";

}

function saveRequest(id) {
  var client = gv("rf-client").trim();
  if (!client) { alert("Введіть клієнта"); return; }
  var data = {
    req_num: gv("rf-num"), client: client, supplier: gv("rf-supplier"), date: fromISODate(gv("rf-date")),
    client_contact: gv("rf-client-contact"), contact: gv("rf-contact"), route: gv("rf-route"), type: gv("rf-type"),
    cargo: gv("rf-cargo"), weight: gv("rf-weight"), ready_date: fromISODate(gv("rf-ready")),
    sum_netto: parseFloat(gv("rf-netto"))||0, sum_brutto: parseFloat(gv("rf-brutto"))||0, markup: (parseFloat(gv("rf-brutto"))||0)-(parseFloat(gv("rf-netto"))||0),
    status: gv("rf-status"), manager: gv("rf-manager"), logist: gv("rf-logist"),
    docs: gv("rf-docs"), comment: gv("rf-comment")
  };
  if (id) {
    var r = db.requests.find(function(x){return x.id===id;});
    // Перевірка конфлікту
    if (r && _editingVersion !== null && (r._v || 0) > _editingVersion) {
      if (!confirm("⚠️ Цей запит щойно змінив інший користувач.\n\nЯкщо збережеш — твої зміни перезапишуть його. Продовжити?")) {
        closeModal(); render(); _editingVersion = null;
        return;
      }
    }
    var wasAccepted = r.status === "Accepted";
    var alreadyHasOrder = db.orders.some(function(o){ return o.order_id === r.order_id; });
    Object.assign(r, data);
    if (data.status === "Accepted" && !wasAccepted && !alreadyHasOrder) {
      saveOne("requests", r); closeModal();
      createOrder(r.id);
      _editingVersion = null;
      return;
    }
    saveOne("requests", r); closeModal(); render();
    _editingVersion = null;
  } else {
    data.id = nextId(db.requests);
    db.requests.unshift(data);
    if (data.status === "Accepted") {
      var exists = db.orders.some(function(o){ return o.order_id === data.order_id; });
      if (!exists) { saveOne("requests", data); closeModal(); createOrder(data.id); return; }
    }
    saveOne("requests", data); closeModal(); render();
  }
}

function deleteRequest(id) {
  if (!confirm("Видалити запит?")) return;
  db.requests = db.requests.filter(function(x){return x.id!==id;});
  supaDelete("requests", id);
  save(); render();
}

function saveOrder(id) {
  var oid = gv("of-oid").trim();
  if (!oid) { alert("Введіть ORDER ID"); return; }
  var data = {
    order_id: oid, client: gv("of-client"), route: gv("of-rfull"), type: gv("of-type"),
    req_id: gv("of-req"), date: fromISODate(gv("of-date")),
    booking: gv("of-book"), carrier: gv("of-carr"),
    container: gv("of-cont"), ready_date: fromISODate(gv("of-ready")), cutoff: fromISODate(gv("of-cut")),
    route_full: gv("of-rfull"), incoterm_code: gv("of-incoterm-code"), etd: fromISODate(gv("of-etd")), eta: fromISODate(gv("of-eta")),
    cargo_status: gv("of-carg"), decl: gv("of-decl"),
    customs_pl_status: gv("of-custpl"), customs_status: gv("of-cust"),
    resort: gv("of-resort"),
    delivery_status: gv("of-deliv"), delivery_date: fromISODate(gv("of-delivdate")),
    sum_netto: parseFloat(gv("of-netto"))||0, sum_brutto: parseFloat(gv("of-brutto"))||0,
    markup_auto: parseFloat(gv("of-markup-auto"))||0, markup_local: parseFloat(gv("of-markup-local"))||0,
    invoice_sum: (num(gv("of-brutto"))-num(gv("of-netto")))+num(gv("of-markup-auto"))+num(gv("of-markup-local")),
    payment_status: gv("of-pay"),
    docs: gv("of-docs"), notes: gv("of-notes"), manager: gv("of-manager"), logist: gv("of-logist")
  };
  if (id) {
    var ord = db.orders.find(function(x){return x.id===id;});
    // Перевірка конфлікту: чи хтось змінив запис поки ти редагувала
    if (ord && _editingVersion !== null && (ord._v || 0) > _editingVersion) {
      if (!confirm("⚠️ Цей ордер щойно змінив інший користувач.\n\nЯкщо збережеш — твої зміни перезапишуть його. Продовжити?")) {
        closeModal(); render(); _editingVersion = null;
        return;
      }
    }
    Object.assign(ord, data);
    saveOne("orders", ord); closeModal(); render();
    _editingVersion = null;
  } else {
    data.id = nextId(db.orders);
    db.orders.unshift(data);
    saveOne("orders", data); closeModal(); render();
  }
}

// ── Helpers ──────────────────────────────────────────────────────
function refocus(id) {
  var el = document.getElementById(id);
  if (el) { el.focus(); var v = el.value; el.value = ""; el.value = v; }
}

function gv(id) { var e=document.getElementById(id); return e ? e.value : ""; }
function num(v) {
  // Надійне перетворення на число — захищає від конкатенації рядків,
  // якщо значення десь випадково збереглось як текст ("0" замість 0)
  if (v === null || v === undefined || v === "") return 0;
  var n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

function escQ(s) {
  return String(s||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}
function safeDocUrl(u) {
  var s = String(u||"").trim();
  return /^(https?:|mailto:)/i.test(s) ? s : "";
}
function nextId(arr) { return arr.reduce(function(m,x){return Math.max(m,x.id||0);},0)+1; }
function closeModal() { document.getElementById("modal-area").innerHTML = ""; }

function toISODate(s) {
  // Convert any date string to yyyy-mm-dd for <input type=date>
  if (!s) return "";
  s = String(s).trim();
  var m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
  if (m) {
    var d = m[1].padStart(2,"0"), mo = m[2].padStart(2,"0"), y = m[3];
    if (y.length===2) y = "20"+y;
    return y+"-"+mo+"-"+d;
  }
  // already iso
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  return "";
}

function fromISODate(s) {
  // Convert yyyy-mm-dd to dd.mm.yyyy for storage/display
  if (!s) return "";
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[3]+"."+m[2]+"."+m[1];
  return s;
}

function fmtDate(s) {
  // Normalize any date to dd.mm.yyyy for display
  if (!s) return "";
  s = String(s).trim();
  var iso = toISODate(s);
  return iso ? fromISODate(iso) : s;
}

function dateInput(id, val) {
  return "<input type='date' id='" + id + "' value='" + toISODate(val||"") + "'>";
}

function parseDateVal(s) {
  if (!s) return null;
  s = String(s).trim();
  // dd.mm.yyyy or dd/mm/yyyy
  var m = s.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
  if (m) {
    var d = parseInt(m[1],10), mo = parseInt(m[2],10), y = parseInt(m[3],10);
    if (y < 100) y += 2000;
    return new Date(y, mo-1, d).getTime();
  }
  // m/d/yy US format fallback
  var m2 = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m2) {
    var mo2 = parseInt(m2[1],10), d2 = parseInt(m2[2],10), y2 = parseInt(m2[3],10);
    if (y2 < 100) y2 += 2000;
    return new Date(y2, mo2-1, d2).getTime();
  }
  return null;
}


function inDateRange(dateStr, fromISO, toISO) {
  if (!fromISO && !toISO) return true;
  var t = parseDateVal(dateStr);
  if (t === null) return false;
  if (fromISO) { var f = parseDateVal(fromISO.split("-").reverse().join(".")); if (f !== null && t < f) return false; }
  if (toISO) { var to = parseDateVal(toISO.split("-").reverse().join(".")); if (to !== null && t > to) return false; }
  return true;
}

function genReqNum() {
  // Номер запиту — власний лічильник запитів (незалежний від ордерів)
  var maxNum = 0;
  db.requests.forEach(function(r){
    var n = parseInt(r.req_num, 10);
    if (!isNaN(n) && n > maxNum) maxNum = n;
  });
  return String(maxNum + 1).padStart(4, "0");
}

function transportIcon(t) {
  var m = {"Авто":"🚚","Море":"🚢","Авіа":"✈️","Мультимодальне":"🚢🚚","Комбіноване":"🚢🚚","ЖД":"🚂"};
  return m[t] || "🚢";
}

function genOrderId() {
  // Номер ордера — власний наскрізний лічильник (ZED0001, ZED0002…),
  // завжди наступний після найбільшого існуючого. Довгі реєстрові
  // номери (ZED + 5+ цифр) не враховуються, щоб не "стрибати".
  var maxNum = 0;
  db.orders.forEach(function(o){
    var m = String(o.order_id||"").match(/^ZED0*(\d{1,4})$/);
    if (m) { var n = parseInt(m[1], 10); if (!isNaN(n) && n > maxNum) maxNum = n; }
  });
  return "ZED" + String(maxNum + 1).padStart(4, "0");
}

// ── ТРАНЗИТ (контейнери з ETA у межах 2 тижнів) ──────────────────
function daysUntil(dateStr) {
  var t = parseDateVal(dateStr);
  if (t === null) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  return Math.round((t - today.getTime()) / 86400000);
}

function etaLabel(days) {
  if (days === null) return "—";
  if (days < 0) return (-days) + " дн тому";
  if (days === 0) return "сьогодні";
  return "за " + days + " дн";
}

function resortPillTransit(s) {
  var m = {"Не потрібна":"p-calc","В процесі":"p-wait","Завершено":"p-paid","TBD":"p-reject"};
  return statusPill(s, m);
}

function extractSupplier(o) {
  if (o.supplier) return o.supplier;
  var notes = o.notes || "";
  var m = notes.match(/Постачальник:\s*([^•]+)/);
  return m ? m[1].trim() : "";
}

function extractManagerDisplay(o) {
  if (o.manager && o.manager !== "—") return { text: o.manager, raw: false };
  var notes = o.notes || "";
  var m = notes.match(/менеджер:\s*([^•]+)/i);
  if (m) return { text: m[1].trim(), raw: true };
  return { text: "—", raw: false };
}

function nearBorderOrCustoms(status) {
  if (!status) return false;
  var s = status.toLowerCase();
  return s.indexOf("кордон") >= 0 || s.indexOf("митниц") >= 0;
}

function renderTransit() {
  var usingCustomRange = transitDateFrom || transitDateTo;
  var list = (db.orders||[]).filter(function(o) {
    if (usingCustomRange) {
      var inR1 = inDateRange(o.eta, transitDateFrom, transitDateTo);
      var inR2 = inDateRange(o.eta_plan, transitDateFrom, transitDateTo);
      if (!inR1 && !inR2) return false;
    } else {
      var d1 = daysUntil(o.eta);
      var d2 = daysUntil(o.eta_plan);
      var inWin1 = d1 !== null && d1 >= -10 && d1 <= 10;
      var inWin2 = d2 !== null && d2 >= -10 && d2 <= 10;
      if (!inWin1 && !inWin2) return false;
    }
    if (transitCustomsFilter && (o.customs_status||"TBD") !== transitCustomsFilter) return false;
    return true;
  });

    var da = daysUntil(a.eta); if (da === null) da = daysUntil(a.eta_plan);

    + "<p style='font-size:12px;color:#6b7280;margin-bottom:12px'>Обери аркуш «FCL» з файлу UB (.xlsx). Оновлює ЛИШЕ ETA, дату завантаження PL/UA, авто та статус в існуючих ордерах за номером контейнера — нових записів не створює, порожні поля не затирають наявні дані.</p>"
    + "<input type='file' id='ub-file-inp' accept='.xlsx,.xls'>"
    + "<div id='ub-log' style='font-family:monospace;font-size:11px;background:#1a1a2e;color:#a7f3d0;border-radius:8px;padding:12px;max-height:320px;overflow-y:auto;white-space:pre-wrap;display:none;margin-top:12px'></div>"
    + "<div class='modal-btns'>"
    + "<button class='btn btn-gray' onclick='closeModal()'>Закрити</button>"
    + "<button class='btn btn-yellow' id='ub-run-btn' onclick='runUbImport()'>Обробити файл</button>"
    + "</div></div></div>";
  document.getElementById("modal-area").innerHTML = html;
}

function ubLog(msg) {
  var el = document.getElementById("ub-log");
  if (!el) return;
  el.style.display = "block";
  el.textContent += msg + "\n";
  el.scrollTop = el.scrollHeight;
}

function ubCellText(v) {
  if (v === null || v === undefined) return "";
  if (v instanceof Date) {
    // SheetJS може дати дату з мікро-похибкою (напр. 23:59:56 замість 00:00:00),
    // через що день "з'їжджає" на попередній — округлюємо до найближчої доби
    var rounded = new Date(Math.round(v.getTime() / 86400000) * 86400000);
    var d = rounded.getUTCDate(), m = rounded.getUTCMonth()+1, y = rounded.getUTCFullYear();
    return (d<10?"0":"")+d+"."+(m<10?"0":"")+m+"."+y;
  }
  return String(v).trim();
}

function findFclSheet(wb) {
  for (var i = 0; i < wb.SheetNames.length; i++) {
    if (wb.SheetNames[i].toLowerCase().replace(/\s/g,"").indexOf("fcl") >= 0) return wb.SheetNames[i];
  }
  return null;
}

function runUbImport() {
  var fileInp = document.getElementById("ub-file-inp");
  var file = fileInp && fileInp.files && fileInp.files[0];
  if (!file) { alert("Обери файл"); return; }
  document.getElementById("ub-run-btn").disabled = true;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var wb = XLSX.read(e.target.result, { type: "array", cellDates: true });
      var sheetName = findFclSheet(wb);
      if (!sheetName) { ubLog("✗ Аркуш FCL не знайдено у файлі. Наявні аркуші: " + wb.SheetNames.join(", ")); return; }
      ubLog("Аркуш знайдено: \"" + sheetName + "\"");
      var ws = wb.Sheets[sheetName];
      var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true, cellDates: true });
      if (!rows.length) { ubLog("✗ Аркуш порожній"); return; }

      // Перевірка заголовків
      var hdr = rows[0];
      var badCols = [];
      UB_HEADER_CHECK.forEach(function(chk) {
        var val = ubCellText(hdr[chk.idx]).toLowerCase();
        if (val.indexOf(chk.mustContain) < 0) badCols.push(chk.label + " (очікував \"" + chk.mustContain + "\", знайшов \"" + ubCellText(hdr[chk.idx]) + "\")");
      });
      if (badCols.length) {
        ubLog("⚠️ СТРУКТУРА ФАЙЛУ ЗМІНИЛАСЬ — імпорт зупинено, щоб не записати неправильні дані.");
        ubLog("Проблемні колонки:");
        badCols.forEach(function(b){ ubLog("  • " + b); });
        ubLog("Покажи цей файл Claude, щоб оновити парсер.");
        document.getElementById("ub-run-btn").disabled = false;
        return;
      }
      ubLog("Заголовки перевірено — структура файлу відповідає очікуваній.\n");

      // Парсинг рядків
      var parsed = {};
      for (var i = 1; i < rows.length; i++) {
        var r = rows[i];
        if (!r) continue;
        var container = ubCellText(r[UB_COLS.container]).toUpperCase();
        if (!container) continue;
        var etaPlan = ubCellText(r[UB_COLS.etaPlan]);
        var etaFact = ubCellText(r[UB_COLS.etaFact]);
        var eta = etaFact || etaPlan;
        var loadDate = ubCellText(r[UB_COLS.loadDate]);
        var auto = ubCellText(r[UB_COLS.auto]);
        var status = ubCellText(r[UB_COLS.status]);
        var supplier = ubCellText(r[UB_COLS.supplier]);
        if (!eta && !etaPlan && !loadDate && !auto && !status && !supplier) continue;
        var entry = {};
        if (eta) entry.eta = eta;
        if (etaPlan) entry.eta_plan = etaPlan;
        if (loadDate) entry.load_date_pl_ua = loadDate;
        if (auto) entry.truck_info = auto;
        if (status) entry.ub_status = status;
        if (supplier) entry.supplier = supplier;
        parsed[container] = entry;
      }
      var contCount = Object.keys(parsed).length;
      ubLog("Знайдено рядків з даними: " + contCount);
      if (!contCount) { ubLog("Немає що оновлювати."); document.getElementById("ub-run-btn").disabled = false; return; }
      ubLog("");
      applyUbUpdates(parsed);
    } catch (err) {
      ubLog("✗ Помилка обробки файлу: " + err.message);
      document.getElementById("ub-run-btn").disabled = false;
    }
  };
  reader.readAsArrayBuffer(file);
}

async function applyUbUpdates(parsed) {
  ubLog("Читаю ордери з Supabase...");
  var res = await fetch(SUPA_BASE + "/orders?select=id,data&limit=10000", { headers: supaHeaders() });
  var rows = await res.json();
  var orders = Array.isArray(rows) ? rows.map(function(r){ var d=r.data||{}; d.id=r.id; return d; }) : [];
  ubLog("В базі: " + orders.length + " ордерів.\n");

  var byContainer = {};
  orders.forEach(function(o){ if (o.container) byContainer[String(o.container).trim().toUpperCase()] = o; });

  var updated = 0, unchanged = 0, notFound = [];
  var keys = Object.keys(parsed);
  for (var i = 0; i < keys.length; i++) {
    var cont = keys[i], upd = parsed[cont];
    var o = byContainer[cont];
    if (!o) { notFound.push(cont); continue; }
    var changes = [];
    if (upd.eta && o.eta !== upd.eta) { changes.push("ETA:" + (o.eta||"—") + "→" + upd.eta); o.eta = upd.eta; }
    if (upd.eta_plan && o.eta_plan !== upd.eta_plan) { changes.push("ETA план:" + upd.eta_plan); o.eta_plan = upd.eta_plan; }
    if (upd.load_date_pl_ua && o.load_date_pl_ua !== upd.load_date_pl_ua) { changes.push("завант:" + upd.load_date_pl_ua); o.load_date_pl_ua = upd.load_date_pl_ua; }
    if (upd.truck_info && o.truck_info !== upd.truck_info) { changes.push("авто оновлено"); o.truck_info = upd.truck_info; }
    if (upd.ub_status && o.ub_status !== upd.ub_status) { changes.push("статус:" + upd.ub_status); o.ub_status = upd.ub_status; }
    if (upd.supplier && o.supplier !== upd.supplier) { changes.push("постачальник:" + upd.supplier); o.supplier = upd.supplier; }
    if (!changes.length) { unchanged++; continue; }
    o._v = (o._v||0) + 1;
    try {
      var r = await fetch(SUPA_BASE + "/orders", { method: "POST", headers: supaHeaders(), body: JSON.stringify({ id: o.id, data: o, updated_at: new Date().toISOString() }) });
      if (r.ok) { updated++; ubLog("✓ " + o.order_id + " (" + cont + "): " + changes.join(" | ")); }
      else { ubLog("✗ " + o.order_id + " (" + cont + "): HTTP " + r.status); }
    } catch (e) { ubLog("✗ " + cont + ": " + e.message); }
  }
  ubLog("");
  ubLog("ГОТОВО ✅  Оновлено: " + updated + " | Без змін: " + unchanged + " | Не знайдено: " + notFound.length);
  if (notFound.length) ubLog("Не знайдені контейнери (можливо, ще не імпортовані в ZED Hub): " + notFound.join(", "));
  document.getElementById("ub-run-btn").disabled = false;
  try { db = await cloudLoad(); render(); } catch(e) {}
}

// ── СТАТИСТИКА ────────────────────────────────────────────────────
var _statsCharts = {}; // зберігаємо інстанси Chart.js щоб знищувати перед перемальовкою
var statsDateFrom = "";
var statsDateTo = "";

function isoToday() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function isoMonthStart(offsetMonths) {
  var d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + offsetMonths);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function isoMonthEnd(offsetMonths) {
  var d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + offsetMonths + 1);
  d.setDate(0);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function statsSetPreset(preset) {
  if (preset === "all") { statsDateFrom = ""; statsDateTo = ""; }
  else if (preset === "thisMonth") { statsDateFrom = isoMonthStart(0); statsDateTo = isoToday(); }
  else if (preset === "lastMonth") { statsDateFrom = isoMonthStart(-1); statsDateTo = isoMonthEnd(-1); }
  else if (preset === "quarter") { statsDateFrom = isoMonthStart(-2); statsDateTo = isoToday(); }
  renderStatistics();
}

function orderEarnings(o) {
  return (num(o.sum_brutto) - num(o.sum_netto)) + num(o.markup_auto) + num(o.markup_local);
}

function classifyIncoterms(o) {
  var clean = String(o.incoterm_code||"").trim().toUpperCase();
  if (clean === "FOB" || clean === "CIF" || clean === "FCA" || clean === "EXW") return clean;
  var t = String(o.incoterms||"").trim().toUpperCase();
  if (t.indexOf("FOB") === 0) return "FOB";
  if (t.indexOf("CIF") === 0) return "CIF";
  if (t.indexOf("FCA") === 0) return "FCA";
  if (t.indexOf("EXW") === 0) return "EXW";
  return "Інше";
}

function statsMonthKey(dateStr) {
  var t = parseDateVal(dateStr);
  if (t === null) return null;
  var dt = new Date(t);
  var y = dt.getFullYear(), m = dt.getMonth();
  return { key: y + "-" + String(m+1).padStart(2,"0"), label: UA_MONTHS_SHORT[m] + " " + String(y).substring(2), sortKey: y*100+m };
}
var UA_MONTHS_SHORT = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];

function destroyStatsCharts() {
  Object.keys(_statsCharts).forEach(function(k){
    try { _statsCharts[k].destroy(); } catch(e){}
  });
  _statsCharts = {};
}

function renderStatistics() {
  var orders = (db.orders || []).filter(function(o){ return inDateRange(o.date, statsDateFrom, statsDateTo); });
  var totalOrders = orders.length;
  var totalEarnings = 0;
  var byIncoterm = { FOB: {count:0, earnings:0, netto:0, brutto:0, auto:0, local:0}, CIF: {count:0, earnings:0, netto:0, brutto:0, auto:0, local:0}, FCA: {count:0, earnings:0, netto:0, brutto:0, auto:0, local:0}, EXW: {count:0, earnings:0, netto:0, brutto:0, auto:0, local:0}, "Інше": {count:0, earnings:0, netto:0, brutto:0, auto:0, local:0} };
  var byMonth = {}; // key -> {label, sortKey, earnings, auto}
  var byClient = {}; // client -> {count, earnings}
  var byTransport = {}; // тип перевезення -> {count, earnings}
  var totalAuto = 0;
  var clientsSet = {};

  orders.forEach(function(o) {
    var earn = orderEarnings(o);
    totalEarnings += earn;
    totalAuto += num(o.markup_auto);

    var cat = classifyIncoterms(o);
    byIncoterm[cat].count++;
    byIncoterm[cat].earnings += earn;
    byIncoterm[cat].netto += num(o.sum_netto);
    byIncoterm[cat].brutto += num(o.sum_brutto);
    byIncoterm[cat].auto += num(o.markup_auto);
    byIncoterm[cat].local += num(o.markup_local);

    var mk = statsMonthKey(o.date);
    if (mk) {
      if (!byMonth[mk.key]) byMonth[mk.key] = { label: mk.label, sortKey: mk.sortKey, earnings: 0, auto: 0 };
      byMonth[mk.key].earnings += earn;
      byMonth[mk.key].auto += num(o.markup_auto);
    }

    var cl = o.client || "Без клієнта";
    if (!byClient[cl]) byClient[cl] = { count: 0, earnings: 0 };
    byClient[cl].count++;
    byClient[cl].earnings += earn;
    clientsSet[cl] = true;

    var tt = o.type || "Не вказано";
    if (!byTransport[tt]) byTransport[tt] = { count: 0, earnings: 0 };
    byTransport[tt].count++;
    byTransport[tt].earnings += earn;
  });

  var monthEntries = Object.keys(byMonth).map(function(k){ return byMonth[k]; }).sort(function(a,b){ return a.sortKey - b.sortKey; });
  var clientEntries = Object.keys(byClient).map(function(k){ return { name: k, count: byClient[k].count, earnings: byClient[k].earnings }; })
    .sort(function(a,b){ return b.earnings - a.earnings; });
  var topClients = clientEntries.slice(0, 8);
  var transportEntries = Object.keys(byTransport).map(function(k){ return { name: k, count: byTransport[k].count, earnings: byTransport[k].earnings }; })
    .sort(function(a,b){ return b.earnings - a.earnings; });

  function ordWordFor(n) {
    var mod100 = n % 100, mod10 = n % 10;
    if (mod100 >= 11 && mod100 <= 14) return "ордерів";
    if (mod10 === 1) return "ордер";
    if (mod10 >= 2 && mod10 <= 4) return "ордери";
    return "ордерів";
  }

  var completeOrders = orders.filter(function(o){ return num(o.markup_auto) > 0 && num(o.markup_local) > 0; });

  function avgOf(list, fn) {
    return list.length ? (list.reduce(function(s,o){return s+fn(o);},0) / list.length) : 0;
  }
  var freightOnly = function(o){ return num(o.sum_brutto) - num(o.sum_netto); };
  var autoLocal = function(o){ return num(o.markup_auto) + num(o.markup_local); };
  var autoOnly = function(o){ return num(o.markup_auto); };

  var fobComplete = orders.filter(function(o){ return classifyIncoterms(o) === "FOB"; });
  var cifComplete = orders.filter(function(o){ return classifyIncoterms(o) === "CIF"; });
  var autoComplete = orders.filter(function(o){ return classifyIncoterms(o) === "FCA"; });
  var avgByCategory = [
    { label: "FOB", sub: "націнка фрахта", count: fobComplete.length, avg: avgOf(fobComplete, freightOnly), full: avgOf(fobComplete, orderEarnings), color: "#f59e0b" },
    { label: "CIF", sub: "локальні + авто", count: cifComplete.length, avg: avgOf(cifComplete, autoLocal), color: "#0e7490" },
    { label: "FCA / АВТО", sub: "авто перевезення", count: autoComplete.length, avg: avgOf(autoComplete, autoOnly), color: "#16a34a" }
  ];
  var avgMarkup = completeOrders.length ? (completeOrders.reduce(function(s,o){ return s + orderEarnings(o); }, 0) / completeOrders.length) : 0;
  var activeClients = Object.keys(clientsSet).length;

  var html = "";

  // ── Панель вибору періоду ──
  html += "<div class='toolbar'>"
    + "<button class='btn " + (!statsDateFrom && !statsDateTo ? "btn-yellow" : "btn-gray") + "' onclick='statsSetPreset(\"all\")'>Весь час</button>"
    + "<button class='btn btn-gray' onclick='statsSetPreset(\"thisMonth\")'>Цей місяць</button>"
    + "<button class='btn btn-gray' onclick='statsSetPreset(\"lastMonth\")'>Минулий місяць</button>"
    + "<button class='btn btn-gray' onclick='statsSetPreset(\"quarter\")'>Останні 3 місяці</button>"
    + "<span style='display:flex;align-items:center;gap:4px;font-size:11px;color:#6b7280;margin-left:8px'>📅 <input type='date' class='filter-sel' style='padding:5px 8px' value='" + statsDateFrom + "' onchange='statsDateFrom=this.value;renderStatistics()'> — <input type='date' class='filter-sel' style='padding:5px 8px' value='" + statsDateTo + "' onchange='statsDateTo=this.value;renderStatistics()'></span>"
    + "</div>";

  // ── Загальні картки ──
  html += "<div class='stats-bar'>"
    + "<div class='stat-card'><div class='stat-val'>" + totalOrders + "</div><div class='stat-label'>ВСЬОГО ОРДЕРІВ</div></div>"
    + "<div class='stat-card'><div class='stat-val' style='color:#16a34a'>$ " + Math.round(totalEarnings).toLocaleString("uk-UA") + "</div><div class='stat-label'>ЗАГАЛЬНА НАЦІНКА</div></div>"
    + "<div class='stat-card'><div class='stat-val' style='color:#f59e0b'>$ " + Math.round(avgMarkup).toLocaleString("uk-UA") + "</div><div class='stat-label'>СЕРЕДНЯ НАЦІНКА / ОРДЕР</div></div>"
    + "<div class='stat-card'><div class='stat-val'>" + activeClients + "</div><div class='stat-label'>КЛІЄНТІВ</div></div>"
    + "</div>";

  if (!totalOrders) {
    var hasAnyOrders = (db.orders||[]).length > 0;
    html += "<div class='empty-state'><div class='empty-icon'>📊</div><div class='empty-text'>" + (hasAnyOrders ? "Немає ордерів за обраний період" : "Немає даних для статистики — додай ордери") + "</div></div>";
    document.getElementById("main-content").innerHTML = html;
    return;
  }

  // ── По типу перевезення + По клієнтам (поруч, клієнти справа) ──
  var clientsForChart = clientEntries.slice(0, 6);
  var clientsOtherSum = clientEntries.slice(6).reduce(function(s,c){return s+c.earnings;},0);
  if (clientsOtherSum > 0) clientsForChart = clientsForChart.concat([{name:"Інші", earnings: clientsOtherSum}]);

  html += "<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-bottom:12px;align-items:start'>"
    + "<div class='table-wrap' style='padding:14px;background:#fff'>"
    + "<div class='section-title' style='margin-top:0;margin-bottom:8px'>По типу перевезення</div>"
    + "<table style='font-size:12px'><thead><tr style='background:transparent'>"
    + "<th style='color:#6b7280;padding:5px 4px'>ТИП ПЕРЕВЕЗЕННЯ</th><th style='color:#6b7280;padding:5px 4px;text-align:right'>ОРДЕРІВ</th><th style='color:#6b7280;padding:5px 4px;text-align:right'>НАЦІНКА $</th>"
    + "</tr></thead><tbody>"
    + transportEntries.map(function(t){
        return "<tr><td style='padding:6px 4px'>" + transportIcon(t.name) + " " + escQ(t.name) + "</td>"
          + "<td style='padding:6px 4px;text-align:right'>" + t.count + "</td>"
          + "<td style='padding:6px 4px;text-align:right;font-weight:700;color:#16a34a'>$ " + Math.round(t.earnings).toLocaleString("uk-UA") + "</td></tr>";
      }).join("")
    + "</tbody></table>"
    + "</div>"
    + "<div class='table-wrap' style='padding:14px;background:#fff'>"
    + "<div class='section-title' style='margin-top:0;margin-bottom:8px'>По клієнтам</div>"
    + "<div style='position:relative;height:200px'><canvas id='chartClients'></canvas></div>"
    + "<table style='font-size:11px;margin-top:8px'><tbody>"
    + clientEntries.slice(0,6).map(function(c){
        return "<tr><td style='padding:3px 4px;font-weight:600'>"+escQ(c.name)+"</td>"
          + "<td style='padding:3px 4px;text-align:right;color:#6b7280'>"+c.count+" орд.</td>"
          + "<td style='padding:3px 4px;text-align:right;font-weight:700;color:#16a34a'>$ "+Math.round(c.earnings).toLocaleString("uk-UA")+"</td></tr>";
      }).join("")
    + "</tbody></table>"
    + "</div>"
    + "</div>";

  // ── Середня націнка: FOB / CIF / FCA (компактно, без графіка) ──
  html += "<div class='table-wrap' style='padding:14px;background:#fff;margin-bottom:12px;max-width:680px'>"
    + "<div class='section-title' style='margin-top:0;margin-bottom:10px'>Середня націнка: FOB / CIF / FCA</div>"
    + "<div style='display:flex;gap:24px;flex-wrap:wrap'>"
    + avgByCategory.map(function(c){
        var ordWord = ordWordFor(c.count);
        return "<div>"
          + "<div style='font-size:22px;font-weight:700;color:" + c.color + "'>$ " + Math.round(c.avg).toLocaleString("uk-UA") + "</div>"
          + "<div style='font-size:11px;color:#9ca3af'>" + c.label + " (" + c.sub + ") — " + c.count + " " + ordWord + "</div>"
          + (c.full !== undefined ? "<div style='font-size:11px;color:#374151;margin-top:3px'>Повний ордер (фрахт+авто+локальні): <b>$ " + Math.round(c.full).toLocaleString("uk-UA") + "</b></div>" : "")
          + "</div>";
      }).join("")
    + "</div>"
    + "</div>";

  // ── Деталі за умовами поставки (окремо) ──
  html += "<div class='table-wrap' style='padding:14px;background:#fff;margin-bottom:12px;max-width:680px'>"
    + "<div class='section-title' style='margin-top:0;margin-bottom:8px'>Деталі за умовами поставки</div>"
    + "<table style='font-size:12px'><thead><tr style='background:transparent'>"
    + "<th style='color:#6b7280;padding:5px 4px'>УМОВИ</th><th style='color:#6b7280;padding:5px 4px;text-align:right'>ОРДЕРІВ</th><th style='color:#6b7280;padding:5px 4px;text-align:right'>НЕТТО $</th><th style='color:#6b7280;padding:5px 4px;text-align:right'>БРУТТО $</th><th style='color:#6b7280;padding:5px 4px;text-align:right'>НАЦІНКА $</th><th style='color:#6b7280;padding:5px 4px;text-align:right'>СЕРЕДНЯ НАЦІНКА НА ФРАХТ $</th>"
    + "</tr></thead><tbody>"

    + "<div style='font-size:12px;color:#6b7280'>Ордерів з націнкою авто: <b>" + ordersWithAuto + "</b> з " + totalOrders + "</div>"
    + "</div>";

  document.getElementById("main-content").innerHTML = html;

  // ── Ініціалізація графіків (canvas вже в DOM після innerHTML) ──
  destroyStatsCharts();
  if (typeof Chart === "undefined") {
    // Chart.js ще не встиг завантажитись з CDN — пробуємо ще раз трохи згодом,
    // замість того щоб мовчки лишити графіки порожніми
    setTimeout(function(){ if (currentTab === "statistics") renderStatistics(); }, 400);
    return;
  }

  var AMBER = "#f59e0b", TEAL = "#0e7490", GRAY = "#d1d5db", GREEN = "#16a34a", PURPLE = "#6d28d9";

  function safeChart(key, canvasId, config) {
    try {
      var el = document.getElementById(canvasId);
      if (!el) { throw new Error("canvas #" + canvasId + " не знайдено в DOM"); }
      _statsCharts[key] = new Chart(el, config);
    } catch (err) {
      console.error("ZED Hub: помилка графіка " + canvasId + ":", err);
      var el2 = document.getElementById(canvasId);
      if (el2 && el2.parentNode) {
        var msg = document.createElement("div");
        msg.style.cssText = "color:#dc2626;font-size:11px;font-family:monospace;padding:10px;background:#fef2f2;border-radius:6px";
        msg.textContent = "⚠️ Графік не побудувався: " + (err && err.message ? err.message : err);
        el2.parentNode.insertBefore(msg, el2);
      }
    }
  }

  var clientPalette = [AMBER, TEAL, PURPLE, GREEN, "#dc2626", "#2563eb", GRAY];
  safeChart("clients", "chartClients", {
    type: "doughnut",
    data: {
      labels: clientsForChart.map(function(c){ return c.name.length>20 ? c.name.substring(0,18)+"…" : c.name; }),
      datasets: [{ data: clientsForChart.map(function(c){ return Math.round(c.earnings); }), backgroundColor: clientPalette.slice(0, clientsForChart.length), borderWidth: 0 }]
    },
    options: { maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { font: { size: 10 }, boxWidth: 10, padding: 8 } } }, cutout: "55%" }
  });
}

var refSearch = "";

function refIcon(title) {
  var t = String(title||"").toLowerCase();
  // Специфічні інструменти екосистеми (перевіряємо перед загальними правилами)
  if (t.indexOf("insurance")>=0 || t.indexOf("страхов")>=0) return "🛡";
  if (t.indexOf("cmr")>=0) return "🚚";
  if (t.indexOf("checker")>=0 || t.indexOf("check")>=0 || t.indexOf("перевір")>=0) return "🔍";
  if (t.indexOf("creator")>=0 || t.indexOf("ai agent")>=0 || t.indexOf("агент")>=0) return "🤖";
  if (t.indexOf("eta")>=0 || t.indexOf("порівн")>=0 || t.indexOf("comparison")>=0) return "📅";
  if (t.indexOf("portal")>=0 || t.indexOf("портал")>=0 || t.indexOf("customer")>=0) return "🌐";
  if (t.indexOf("прототип")>=0 || t.indexOf("prototype")>=0) return "🧪";
  if (t.indexOf("інструкц")>=0 || t.indexOf("instruction")>=0 || t.indexOf("внутр")>=0) return "📋";
  // Загальна логістична/офісна термінологія
  if (t.indexOf("митниц")>=0 || t.indexOf("брокер")>=0) return "🛃";
  if (t.indexOf("банк")>=0 || t.indexOf("рахун")>=0 || t.indexOf("оплат")>=0) return "🏦";
  if (t.indexOf("договір")>=0 || t.indexOf("контракт")>=0) return "📝";
  if (t.indexOf("телефон")>=0 || t.indexOf("контакт")>=0 || t.indexOf("дзвін")>=0) return "📞";
  if (t.indexOf("email")>=0 || t.indexOf("пошта")>=0 || t.indexOf("e-mail")>=0) return "📧";
  if (t.indexOf("порт")>=0 || t.indexOf("термінал")>=0) return "⚓";
  if (t.indexOf("склад")>=0) return "🏭";
  if (t.indexOf("адрес")>=0 || t.indexOf("локац")>=0) return "📍";
  if (t.indexOf("накладн")>=0 || t.indexOf("інвойс")>=0 || t.indexOf("документ")>=0) return "📄";
  if (t.indexOf("правил")>=0) return "📋";
  if (t.indexOf("митна декларац")>=0 || t.indexOf("вмд")>=0) return "🧾";
  return "🔗";
}

function saveRef(id) {
  var title = gv("rff-title").trim();
  if (!title) { alert("Введіть назву"); return; }
  var linksRaw = gv("rff-links").trim();
  var links = linksRaw ? linksRaw.split("\n").map(function(l){return l.trim();}).filter(Boolean) : [];
  var data = { title: title, text: gv("rff-text"), links: links };
  if (!db.references) db.references = [];
  if (id) {
    var x = db.references.find(function(r){return r.id===id;});
    Object.assign(x, data);
    saveOne("refs", x);
  } else {
    data.id = nextId(db.references);
    db.references.unshift(data);
    saveOne("refs", data);
  }
  closeModal(); render();
}

function deleteRef(id) {
  if (!confirm("Видалити запис?")) return;
  db.references = db.references.filter(function(x){return x.id!==id;});
  supaDelete("refs", id);
  saveRefCloud(); render();
}

function saveRefCloud() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch(e) {}
  updateCounts();
  (db.references||[]).forEach(function(x){ queueSync("refs", x); });
}

var TASK_STATUSES = ["Нова","В роботі","Виконана"];
var taskSearch = "";
var taskAssigneeFilter = "";
var ALL_PEOPLE = MANAGERS.filter(function(m){return m!=="—";}).concat(LOGISTS.filter(function(l){return l!=="—";}));

function taskStatusCls(s) {
  var m = {"Нова":"p-new","В роботі":"p-wait","Виконана":"p-paid"};
  return m[s] || "p-new";
}

function renderTasker() {
  if (!db.tasks) db.tasks = [];
  var filtered = db.tasks.filter(function(t) {
    var q = taskSearch.toLowerCase();
    var matchQ = !q || (t.text||"").toLowerCase().indexOf(q) >= 0 || (t.order_id||"").toLowerCase().indexOf(q) >= 0;
    var matchA = !taskAssigneeFilter || (t.assignee||"") === taskAssigneeFilter;
    return matchQ && matchA;
  });
  // Sort: open first, then by deadline (soonest), done at bottom
  filtered.sort(function(a,b){
    var aDone = a.status==="Виконана" ? 1 : 0, bDone = b.status==="Виконана" ? 1 : 0;
    if (aDone !== bDone) return aDone - bDone;
    var da = parseDateVal(a.deadline), dbb = parseDateVal(b.deadline);
    if (da===null && dbb===null) return 0;
    if (da===null) return 1;
    if (dbb===null) return -1;
    return da - dbb;
  });

  var open = db.tasks.filter(function(t){return t.status!=="Виконана";}).length;
  var inWork = db.tasks.filter(function(t){return t.status==="В роботі";}).length;
  var done = db.tasks.filter(function(t){return t.status==="Виконана";}).length;

  var html = "<div class='stats-bar stats-3'>"
    + "<div class='stat-card'><div class='stat-val'>" + open + "</div><div class='stat-label'>ВІДКРИТИХ ЗАДАЧ</div></div>"
    + "<div class='stat-card'><div class='stat-val' style='color:#f59e0b'>" + inWork + "</div><div class='stat-label'>В РОБОТІ</div></div>"
    + "<div class='stat-card'><div class='stat-val' style='color:#16a34a'>" + done + "</div><div class='stat-label'>ВИКОНАНО</div></div>"
    + "</div>";

  html += "<div class='toolbar'>"
    + "<input class='search-box' placeholder='🔍 Пошук задачі...' value='" + escQ(taskSearch) + "' id='search-task' oninput='taskSearch=this.value;renderTasker();refocus(&quot;search-task&quot;)'>"
    + "<select class='filter-sel' onchange='taskAssigneeFilter=this.value;renderTasker()'>"
    + "<option value=''>👤 Всі виконавці</option>"
    + ALL_PEOPLE.map(function(p){return "<option value='" + p + "'" + (taskAssigneeFilter===p?" selected":"") + ">" + p + "</option>";}).join("")
    + "</select>"
    + "<button class='btn btn-yellow' onclick='openAddTask()'>+ Задача</button>"
    + "</div>";

  if (!filtered.length) {
    html += "<div style='text-align:center;padding:60px;color:#9ca3af'>✅<br>" + (taskSearch||taskAssigneeFilter ? "Задач не знайдено" : "Додайте першу задачу") + "</div>";
    document.getElementById("main-content").innerHTML = html;
    return;
  }

  html += "<div class='table-wrap'><table><thead><tr>"
    + "<th>СТАТУС</th><th>ЗАДАЧА</th><th>ОРДЕР</th><th>ВІД КОГО</th><th>КОМУ</th><th>ДЕДЛАЙН</th><th>ДІЇ</th>"
    + "</tr></thead><tbody>";
  filtered.forEach(function(t) {
    var overdue = t.status!=="Виконана" && t.deadline && parseDateVal(t.deadline) && parseDateVal(t.deadline) < Date.now() - 86400000;
    html += "<tr class='" + (t.status==="Виконана"?"":"") + "'>"
      + "<td><select class='pill-select " + taskStatusCls(t.status) + "' onchange='updateTaskStatus(" + t.id + ",this.value)'>"
      + TASK_STATUSES.map(function(s){return "<option" + (t.status===s?" selected":"") + ">" + s + "</option>";}).join("")
      + "</select></td>"
      + "<td style='max-width:280px'><div style='font-size:12px;" + (t.status==="Виконана"?"text-decoration:line-through;color:#9ca3af":"") + "'>" + escQ(t.text||"") + "</div></td>"
      + "<td>" + (t.order_id ? "<span class='order-id' style='cursor:pointer;text-decoration:underline' title='Відкрити ордер' onclick='openOrderFromTask(\"" + escQ(t.order_id) + "\")'>" + escQ(t.order_id) + "</span>" : "<span style='color:#d1d5db'>—</span>") + "</td>"
      + "<td style='font-size:11px;color:#6b7280'>" + escQ(t.author||"—") + "</td>"
      + "<td style='font-size:11px;font-weight:600'>" + escQ(t.assignee||"—") + "</td>"
      + "<td style='font-size:11px;" + (overdue?"color:#ef4444;font-weight:700":"color:#6b7280") + "'>" + escQ(fmtDate(t.deadline)||"—") + (overdue?" ⚠️":"") + "</td>"
      + "<td style='white-space:nowrap'>"
      + "<button class='act-btn' onclick='openEditTask(" + t.id + ")'>✏️</button> "
      + "<button class='act-btn del' onclick='deleteTask(" + t.id + ")'>✕</button>"
      + "</td></tr>";
  });
  html += "</tbody></table></div>";
  document.getElementById("main-content").innerHTML = html;
}

    + "</div></div></div>";

function saveTask(id) {
  var text = gv("tf-text").trim();
  if (!text) { alert("Введіть текст задачі"); return; }
  var data = {
    text: text, order_id: gv("tf-order"), deadline: fromISODate(gv("tf-deadline")),
    author: gv("tf-author"), assignee: gv("tf-assignee"), status: gv("tf-status")
  };
  if (!db.tasks) db.tasks = [];
  if (id) {
    var t = db.tasks.find(function(x){return x.id===id;});
    if (t && _editingVersion !== null && (t._v || 0) > _editingVersion) {
      if (!confirm("⚠️ Цю задачу щойно змінив інший користувач.\n\nЯкщо збережеш — твої зміни перезапишуть його. Продовжити?")) {
        closeModal(); render(); _editingVersion = null; return;
      }
    }
    Object.assign(t, data);
    saveOne("tasks", t);
    _editingVersion = null;
  } else {
    data.id = nextId(db.tasks);
    data.date = new Date().toLocaleDateString("uk-UA");
    db.tasks.unshift(data);
    saveOne("tasks", data);
  }
  closeModal(); render();
}

function updateTaskStatus(id, status) {
  var t = db.tasks.find(function(x){return x.id===id;});
  if (t) { t.status = status; saveOne("tasks", t); render(); }
}

function deleteTask(id) {
  if (!confirm("Видалити задачу?")) return;
  db.tasks = db.tasks.filter(function(x){return x.id!==id;});
  supaDelete("tasks", id);
  save(); render();
}

function sendOrderMail(orderId) {
  var o = db.orders.find(function(x){return x.id===orderId;});
  if (!o) return;
  var target = normName(o.client);
  var cli = (db.clients||[]).find(function(c){ return normName(c.name)===target; });
  // Fallback: if no exact match and only one client has emails, use it
  if (!cli) {
    var withEmails = (db.clients||[]).filter(function(c){ return c.emails && c.emails.length; });
    if (withEmails.length === 1) cli = withEmails[0];
  }
  var email = cli && cli.emails && cli.emails.length ? cli.emails.join(",") : "";
  if (!email) {
    alert("Email не знайдено для клієнта \"" + (o.client||"") + "\". Додайте email у вкладці Клієнти.");
    switchTab("clients");
    return;
  }
  var subj = encodeURIComponent("Статус контейнера — " + o.order_id + (o.container ? " (" + o.container + ")" : ""));
  var body = encodeURIComponent("Доброго дня!\n\nІнформація по контейнеру:\nORDER ID: " + o.order_id + "\nНомер контейнера: " + (o.container||"—") + "\nСтатус вантажу: " + (o.cargo_status||"—") + "\n\nZ повагою,\nZED Logistics");
  window.open("mailto:" + email + "?subject=" + subj + "&body=" + body, "_blank");
}

// Закривати панель Виконавці при кліку поза нею
document.addEventListener("mousedown", function(e){
  if (!ordExecOpen) return;
  var el = e.target;
  var insidePanel = false;
  while (el) {
    var oc = el.getAttribute ? (el.getAttribute("onclick")||"") : "";
    var och = el.getAttribute ? (el.getAttribute("onchange")||"") : "";
    if (oc.indexOf("ordExecOpen") >= 0 || och.indexOf("toggleExecFilter") >= 0
        || oc.indexOf("toggleExecFilter") >= 0 || oc.indexOf("ordManagerSel=[]") >= 0) {
      insidePanel = true; break;
    }
    el = el.parentElement;
  }
  if (!insidePanel) {
    ordExecOpen = false;
    renderOrders();
  }
});
</script>
</body>
</html>
